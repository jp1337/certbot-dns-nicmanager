name: Publish to PyPI

# Publishes to PyPI when a version tag is pushed (e.g. v1.0.0), using PyPI
# Trusted Publishing (OIDC) — no API tokens or secrets are stored in the repo.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   - PyPI Project Name: certbot-dns-nicmanager
#   - Owner:             jp1337
#   - Repository name:   certbot-dns-nicmanager
#   - Workflow name:     publish.yml
#   - Environment name:  pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # The build reads the version from pyproject.toml, not from the tag: a tag
      # pushed without the bump would publish the previous version's number.
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - name: Install (with test extras)
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[test]'
      - name: Test (do not publish broken builds)
        run: pytest
      - name: Build sdist + wheel
        run: python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
